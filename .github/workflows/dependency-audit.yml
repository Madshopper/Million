name: Dependency Audit

# Kun på PR'er, ugentligt og manuelt (push til main fjernet 09-10-2026 for
# at spare Actions-minutter: samme kode er allerede tjekket i PR'en).
on:
  workflow_dispatch:
  schedule:
    # Hver mandag kl. 06:00 UTC
    - cron: '0 6 * * 1'
  pull_request:
    paths:
      - 'requirements.txt'
      - '.github/workflows/dependency-audit.yml'

# Spar GitHub Actions-minutter: en ny push til samme PR stopper den gamle
# kørsel, der alligevel ville blive forældet.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip setuptools
          pip install -r requirements.txt

      - name: Run pip-audit
        run: |
          pip install pip-audit
          pip-audit --strict
