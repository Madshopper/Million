name: Deploy Edge Worker (staging)

# Samme flow som deploy-edge.yml, men til madshopper-dev (egen KV/D1,
# dev.madshopper.dk) i stedet for produktion - så features kan testes på en
# rigtig edge-deployment uden at røre madshopper.dk.
#
# Dev-branchen er fjernet 02-10-2026: alt arbejde går nu via PR'er direkte til
# main. Staging deployes automatisk fra main, sideløbende med produktionen, så
# dev.madshopper.dk altid kører samme kode som madshopper.dk. Vil man afprøve
# en PR-branch før merge: Actions > "Deploy Edge Worker (staging)" > Run
# workflow, og vælg branchen. Næste push til main skriver staging tilbage.
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'app.py'
      - 'app_support.py'
      - 'src/**'
      - 'templates/**'
      - 'static/**'
      - 'pyproject.toml'
      - 'scripts/build-pages.sh'
      - 'scripts/playwright-uptime-check.mjs'
      # Nyt 19-08-2026: Playwright-installationen er flyttet hertil, og en
      # aendring i den skal kunne proeves af med det samme.
      - 'scripts/install-playwright-ci.sh'
      - 'scripts/test-render-exclusive.py'
      - 'scripts/test-edge-env.py'
      - '.github/workflows/deploy-edge-dev.yml'
      # Indgår i bundtet/afhængigheds-opløsningen - uden dem her kunne en
      # ændring ligge udeployeret uden at nogen så det.
      - '_routes.json'
      - 'uv.lock'


# Se begrundelsen i deploy-edge.yml. Samme gruppe som cache-updater bruger ved
# staging_only, så et staging-seed og en staging-deploy ikke kan overlappe.
concurrency:
  group: madshopper-edge-staging
  cancel-in-progress: false

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  DEPLOY_ENV: staging

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Setup Python
        run: uv python install 3.12

      - name: Install dependencies
        run: uv sync

      - name: Build Edge bundle
        env:
          CACHE_REFRESH_SECRET: ${{ secrets.CACHE_REFRESH_SECRET }}
          # Adgangsspaerring paa staging. madshopper-dev koerer den samme kode
          # mod SAMME Supabase-projekt og samme auth.users som produktionen, men
          # paa et offentligt custom domain. Uden denne er hele fladen aaben for
          # enhver der gaetter adressen. Er secret'en ikke sat, genererer
          # build-pages.sh en tilfaeldig ved hvert build - saa skifter
          # adgangsnoeglen ved hvert deploy (spaerringen virker stadig).
          STAGING_ACCESS_SECRET: ${{ secrets.STAGING_ACCESS_SECRET }}
          # Valgfri: D1-budget i /admin (kun Account Analytics: Read).
          CF_ANALYTICS_TOKEN: ${{ secrets.CF_ANALYTICS_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: bash scripts/build-pages.sh

      # Kørte KUN i produktions-workflowet. Dermed kunne en ændring der
      # genindfører per-request-logning eller tænder observability leve på dev
      # uden at nogen gate sagde fra - og først blive stoppet på vej til
      # produktion, hvor den er dyrest at opdage. Gaten hører til begge steder;
      # den er sekunder om at køre.
      - name: Test sikkerhedslogning + observability-gate
        env:
          REQUIRE_DIST: "1"
        run: python3 scripts/test-security-logging.py

      # Se begrundelsen i deploy-edge.yml.
      - name: Test render-laas (isolate-kollision i D1-broen)
        run: python3 scripts/test-render-exclusive.py

      # EdgeKit udleverer kun vars deklareret i Env (src/worker.py). En
      # manglende linje gav ingen fejl, bare en usynlig nøgle (03-10-2026).
      - name: Test edge-env (vars appen læser er deklareret i Env)
        run: python3 scripts/test-edge-env.py

      # Konfliktmarkører i en template blev vist som tekst på forsiden
      # 02-10-2026. Blokerer deploy hvis en merge er committet uløst.
      - name: Test for git-konfliktmarkører
        run: python3 scripts/test-conflict-markers.py

      - name: Test cache-bust af statiske assets
        env:
          REQUIRE_DIST: "1"
        run: python3 scripts/test-cache-bust.py

      - name: Deploy Worker
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: "4.114.0"
          command: deploy
          workingDirectory: dist

      - name: Nulstil edge-cache (cache_version)
        working-directory: dist
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          # Wrangler 4 default'er til lokal KV - uden --remote bumpes
          # cache_version aldrig i Cloudflare, så edge-cachen invalideres ikke.
          npx --yes wrangler@4.114.0 kv key put cache_version "$(date +%s)" \
            --namespace-id b879e69c3a1f477c9c69bbc7e7b041df \
            --remote

      # Efter deployet: kun funktionstjekket (én frisk søgning i en rigtig
      # browser). Opvarmning, CPU-pause og røgtesten med samtidige requests er
      # fjernet 09-10-2026 for at spare GitHub Actions-minutter (de kostede ca.
      # 4-5 af en staging-deploys ca. 10 minutter): staging er lukket for alle
      # andre end admins, så en varm cache gavner ingen, og røgtesten kunne
      # aldrig måle her (Bot Fight Mode gav 403 på 32 af 32 svar). Fejlklassen
      # fra 2026-07-19 overvåges på rigtig trafik af alarmerne i
      # security-monitor.yml.
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      # Samme rettelse som deploy-edge.yml - se dens kommentar for hvorfor.
      - name: Install Playwright (Chromium)
        timeout-minutes: 15
        # Logikken ligger i scripts/install-playwright-ci.sh, saa de tre
        # workflows der bruger Playwright ikke driver fra hinanden. Loekken
        # der stod her, kunne per konstruktion ALDRIG lykkes efter en
        # timeout: `timeout` draeber kun wrapper'en, den efterladte apt-get
        # beholder /var/lib/apt/lists/lock, og de to resterende forsoeg
        # fejlede derfor oejeblikkeligt. Ramte fire koersler 19-08-2026,
        # inkl. produktions-deployet. Se scriptets hoved.
        run: bash scripts/install-playwright-ci.sh

      # Samme funktionstjek som produktionen (deploy-edge.yml): én frisk
      # søgning i en rigtig browser, der skal give varer. Nøglen sendes med på
      # samme navigation (workeren sætter cookien og bevarer query'en).
      #
      # INGEN continue-on-error: kan trinnet ikke maale, skal deployet staa
      # roedt.
      - name: Funktionstjek - soegning giver varer (rigtig browser)
        env:
          STAGING_ACCESS_SECRET: ${{ secrets.STAGING_ACCESS_SECRET }}
        run: node scripts/playwright-uptime-check.mjs "https://dev.madshopper.dk/search/results?q=m%C3%A6lk"
