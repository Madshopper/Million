name: Security Monitor

# Sitets angrebs-alarm. Workers-observability er permanent slaaet fra (dens
# introspektion var selv aarsagen til nedbruddet 2026-07-19), saa der findes
# ingen request- eller fejllog i produktion. src/worker.py taeller i stedet
# 429'ere og 5xx'ere aggregeret pr. minut ned i D1, og dette workflow loefter
# dem til Supabase og FEJLER hvis en taerskel er overskredet.
#
# Alarmkanalen: GitHub sender mail til vedligeholderen, naar et scheduled
# workflow fejler. Derfor er det bevidst, at scriptet returnerer exit-kode 1
# ved alarm - fjern aldrig det.
#
# uptime-worker/ (Cloudflare cron hvert 5. minut) svarer paa "er sitet nede?".
# Dette svarer paa "er nogen ved at goere det nede?" og fanger Cloudflares
# egne 1101/1102 fra GraphQL-analytics - de to daekker hver sin halvdel.
#
# 02-10-2026: uptime-check.yml er slettet (browsertjekkene er flyttet til
# uptime-worker/). Dens to resterende trin, dette relae og synken af
# koerselshistorik til /admin, koerer nu her hver 6. time (hver 3. indtil 09-10-2026).
#
# Bemaerk: GitHub deaktiverer scheduled workflows efter 60 dages inaktivitet i
# repoet - et push/commit nulstiller uret.

on:
  workflow_dispatch:
    inputs:
      cpu_detail_from:
        description: 'Valgfrit: CPU pr. minut fra (ISO, fx 2026-09-15T18:30:00Z)'
        required: false
        default: ''
      cpu_detail_to:
        description: 'Valgfrit: CPU pr. minut til (ISO)'
        required: false
        default: ''
  # LOOKBACK_HOURS i scriptet er 24 t, så hver 6. time er rigeligt, også når
  # GitHub-cron i praksis kommer timer for sent. (Var hver 3. time indtil
  # 09-10-2026; halveret for at spare GitHub Actions-minutter.)
  schedule:
    - cron: '23 */6 * * *'

concurrency:
  group: security-monitor
  cancel-in-progress: false

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # actions: read til kørselshistorik-trinnet (scripts/sync-job-runs.py).
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Install dependencies
        run: pip install httpx

      - name: Hent, arkiver og vurder sikkerhedshaendelser
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          DEPLOY_KEY: ${{ secrets.DEPLOY_KEY }}
          CPU_DETAIL_FROM: ${{ inputs.cpu_detail_from }}
          CPU_DETAIL_TO: ${{ inputs.cpu_detail_to }}
        run: python scripts/relay-security-events.py

      # Kørselshistorik til /admin ("Kørsler"): gemmer de seneste GitHub
      # Actions-kørsler i Supabase (public.job_runs) med workflowets egen token.
      # Ikke et måletrin og ikke en alarm, så det må ikke gøre tjekket rødt;
      # stopper synken, viser admin-panelet hvor længe siden den sidst kørte.
      - name: Gem kørselshistorik (admin)
        if: always()
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ github.token }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          DEPLOY_KEY: ${{ secrets.DEPLOY_KEY }}
        run: python scripts/sync-job-runs.py
