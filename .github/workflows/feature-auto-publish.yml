name: Udgiv funktioner med appen

# Slår en funktion fra Feature-panelet til på madshopper.dk, når den
# appversion, den står til at følge med ('with_app' i app._FEATURES), er i
# App Store. Se scripts/auto-publish-features.py.
#
# Rører hverken D1 eller Supabase: ét opslag hos Apple og højst én KV-læsning
# og -skrivning pr. kørsel.

on:
  schedule:
    # To gange i døgnet (var hver 2. time indtil 09-10-2026; sparer ca. 300
    # GitHub Actions-minutter om måneden). En ny appversion slår altså
    # igennem på hjemmesiden senest et halvt døgn efter, den er i App Store.
    - cron: '15 6,16 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: feature-auto-publish
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - name: Udgiv hvis appen er ude
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: python3 scripts/auto-publish-features.py
