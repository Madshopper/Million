name: Deploy uptime-worker

# Deployer uptime-worker/ (madshopper-uptime: Cloudflare cron hvert 5. minut,
# mail via Resend ved nedbrud og ved OK igen). Rører hverken madshopper,
# madshopper-dev, D1 eller cache_version, så den må køre uafhængigt af
# deploy-edge.yml.
#
# Secrets i GitHub Actions:
#   CLOUDFLARE_API_TOKEN / CLOUDFLARE_ACCOUNT_ID  (findes allerede)
#   RESEND_API_KEY                                (findes allerede, prisalarmer)
#   UPTIME_ALERT_EMAIL                            modtager(e), kommasepareret
#   MONITOR_ACCESS_SECRET                         valgfri; samme værdi som
#     hovedworkerens, så tjekket kommer forbi login-spærringen
# Workflowet fejler hvis RESEND_API_KEY eller UPTIME_ALERT_EMAIL mangler: en uptime-worker der ikke kan
# sende mail, alarmerer ingen.

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'uptime-worker/**'
      - '.github/workflows/deploy-uptime-worker.yml'

concurrency:
  group: deploy-uptime-worker
  cancel-in-progress: false

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Tjek at alarm-secrets er sat
        env:
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          UPTIME_ALERT_EMAIL: ${{ secrets.UPTIME_ALERT_EMAIL }}
        run: |
          missing=""
          [ -n "$RESEND_API_KEY" ] || missing="$missing RESEND_API_KEY"
          [ -n "$UPTIME_ALERT_EMAIL" ] || missing="$missing UPTIME_ALERT_EMAIL"
          if [ -n "$missing" ]; then
            echo "::error::Mangler GitHub Actions-secret(s):$missing"
            exit 1
          fi

      - name: Deploy madshopper-uptime
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: "4.114.0"
          command: deploy
          workingDirectory: uptime-worker

      # Sættes efter deploy, fordi `secret put` kræver at workeren findes.
      # Indtil secrets er sat, logger workeren blot at den ikke kan sende mail.
      - name: Sæt alarm-secrets
        working-directory: uptime-worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          UPTIME_ALERT_EMAIL: ${{ secrets.UPTIME_ALERT_EMAIL }}
          MONITOR_ACCESS_SECRET: ${{ secrets.MONITOR_ACCESS_SECRET }}
        run: |
          printf '%s' "$RESEND_API_KEY" | npx --yes wrangler@4.114.0 secret put RESEND_API_KEY
          printf '%s' "$UPTIME_ALERT_EMAIL" | npx --yes wrangler@4.114.0 secret put ALERT_EMAIL
          if [ -n "$MONITOR_ACCESS_SECRET" ]; then
            printf '%s' "$MONITOR_ACCESS_SECRET" | npx --yes wrangler@4.114.0 secret put MONITOR_ACCESS_SECRET
          fi
