name: Web/app-paritetstests

# Holder web og app i trit paa de steder hvor de deler en KONTRAKT frem for
# en kodebase - altsaa netop dér hvor de kan glide fra hinanden lydloest.
#
# I dag: tema-valget. Web og app gemmer det i den SAMME noegle med de SAMME
# vaerdier ('true'/'false'/noeglen fjernet = foelg systemet), fordi brugeren
# skal moede samme tre valg og samme opfoersel begge steder. Skriver web fx
# 'false' i stedet for at FJERNE noeglen ved "foelg system", er de to
# platforme ude af trit uden at noget andet i projektet opdager det.
# Se docs/paritet.md.
#
# BEVIDST UDEN FOR deploy-workflowet: den kraever Playwright, og
# Playwright-installationen har haengt i deploy-workflows foer (commit
# ff28c7d). En paritetstest maa gerne fejle hoejlydt - den maa ikke kunne
# blokere en hotfix-deploy.
# Kun på PR'er og manuelt (push til main fjernet 09-10-2026 for at spare
# Actions-minutter: samme kode er allerede testet i PR'en).
on:
  pull_request:
    paths:
      - 'templates/base.html'
      - 'static/js/script.js'
      - 'static/css/styles.css'
      - 'apps/mobile/src/theme/**'
      - 'scripts/test-theme-parity.mjs'
      - '.github/workflows/parity-tests.yml'
  workflow_dispatch:

# Spar GitHub Actions-minutter: en ny push til samme PR stopper den gamle
# kørsel, der alligevel ville blive forældet.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  theme-parity:
    runs-on: ubuntu-latest
    # Brug runnerens forudinstallerede Chrome (scripts/install-playwright-ci.sh).
    env:
      PW_CHANNEL: chrome
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Setup Python
        run: uv python install 3.12

      - name: Install Python dependencies
        run: uv sync

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          # Samme version som mobile-tests.yml, saa de to workflows ikke
          # driver fra hinanden i hvad de kan koere.
          node-version: 22

      # Samme retry-moenster som deploy-edge-dev.yml: install'en har haengt foer.
      - name: Install Playwright (Chromium)
        # Logikken ligger i scripts/install-playwright-ci.sh, saa de tre
        # workflows der bruger Playwright ikke driver fra hinanden. Den
        # inline-loekke der stod her, kunne per konstruktion ALDRIG lykkes
        # efter en timeout - se scriptets hoved for hvorfor.
        run: bash scripts/install-playwright-ci.sh

      # Lokal Flask, ikke staging: staging er adgangsspaerret og svarer 404
      # uden noegle paa foerste navigation, og testen aabner bevidst FRISKE
      # browser-kontekster (den skal maale foerstegangsbesoeg). Lokalt findes
      # hverken spaerre eller bot-beskyttelse, saa maalingen er ren.
      - name: Start lokal Flask
        run: |
          uv run python app.py > /tmp/flask.log 2>&1 &
          for i in $(seq 1 60); do
            if curl -fsS -o /dev/null http://127.0.0.1:5001/; then
              echo "Flask svarer efter ${i}s"
              exit 0
            fi
            sleep 1
          done
          echo "::error::Flask kom aldrig op"
          tail -50 /tmp/flask.log
          exit 1

      - name: Tema-paritet (web mod app-kontrakten)
        run: node scripts/test-theme-parity.mjs http://127.0.0.1:5001

      - name: Flask-log ved fejl
        if: failure()
        run: tail -80 /tmp/flask.log || true

      # Flask (startet via `uv run`) holder uv's cache-laas. Lever den stadig,
      # naar setup-uv's efterrydning koerer "uv cache prune", venter den i 5
      # min og fejler jobbet, selvom alle tests bestod (sket 04-10-2026, PR #43).
      - name: Stop lokal Flask
        if: always()
        run: pkill -f "python app.py" || true
