name: Nightly Dispatcher

# Starter nattens kæde: scrapers, så cache-updateren, så næringsdata.
# Scraperne og cache-updateren har ingen egen cron - de startes herfra.
#
# SÅ TIDLIGT SOM MULIGT, MEN MED DE RIGTIGE PRISER (Kalle, 24-10-2026):
# Cloudflare-workeren madshopper-uptime starter slot "nat" (uptime-worker/
# worker.js, startMorning) kl. 00:05 UTC (01:05/02:05 dansk tid, første
# øjeblik i D1's nye skrivedøgn). Fredag og lørdag skifter butikkerne uge på
# et tidspunkt, der varierer (Netto lørdag 17-10 og 24-10, Bilka/Føtex/Meny/
# Spar/Min Købmand fredag 23-10-2026); der starter butikker-klar.yml slottet,
# når den nye uge er ude i butikkernes data, og workeren senest kl. 09:00.
# Dispatcheren venter på scraperne og starter cache-updateren straks
# bagefter.
#
# GitHub-cron kommer i praksis 1-4 timer for sent, så cron'erne herunder er kun
# sikkerhedsnet: scraper-cron'en gør intet, hvis morgenen allerede er startet;
# cache-fallback gør kun noget, hvis cache-updateren ikke har kørt i dette
# UTC-døgn; næring kører bagefter.
#
# BUTIKSDAGE (Kalle, 09-10-2026, for at spare GitHub Actions-minutter): hver
# butik hentes kun de nætter, hvor dens nye avis/tilbud kommer (målt i
# price_history 18-09 til 09-10-2026). Meny ændrer 250-450 priser hver dag og
# hentes derfor hver nat; det gør Rema også, fordi den hentes inde i
# cache-updateren. Manuel start med slot "scrapers" henter altid alle butikker
# (uden cache-updater bagefter); slot "nat" gør det samme som om natten.
on:
  # Ét sikkerhedsnet om dagen (24-10-2026, sparer ca. 60 GitHub-minutter om
  # måneden). Søndag-torsdag tidligt; fredag og lørdag efter kl. 09 dansk tid,
  # hvor workeren altid har startet hentningen. Slottet henter butikkerne, hvis
  # morgenen ikke er startet, og ellers cache-updateren, hvis den mangler.
  # Næringsdata startes nu af cache-updater.yml selv.
  schedule:
    - cron: '31 4 * * 0-4'   # søn-tor (UTC-ugedag = dansk ugedag kl. 04:31)
    - cron: '45 8 * * 5,6'   # fre og lør, god afstand til workerens start kl. 09
  workflow_dispatch:
    inputs:
      slot:
        description: 'Hvad skal startes'
        type: choice
        options:
          - scrapers
          - nat
          - cache-fallback
          - nutrition
        default: scrapers

permissions:
  actions: write
  contents: read

env:
  # Grenens navn som variabel, ikke indsat direkte i kommandoerne.
  REF_NAME: ${{ github.ref_name }}
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  dispatch:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    # To starter af samme slot lige efter hinanden (fx en dublet fra
    # Cloudflare) kører efter hinanden, så den anden ser at cache-updateren
    # allerede er startet.
    concurrency:
      group: nightly-${{ inputs.slot || github.event.schedule }}
      cancel-in-progress: false
    steps:
      - name: Bestem slot ud fra cron-linjen
        id: slot
        env:
          EVENT_NAME: ${{ github.event_name }}
          INPUT_SLOT: ${{ inputs.slot }}
          CRON: ${{ github.event.schedule }}
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          # nat=true: nattens rigtige kørsel (butiksdage + cache-updater
          # bagefter). "nat" startes af Cloudflare (uptime-worker/worker.js,
          # startMorning) eller af butikker-klar.yml. Manuel "scrapers" henter
          # alle butikker og rører ikke cache-updateren.
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            if [ "$INPUT_SLOT" = "nat" ]; then
              echo "slot=scrapers" >> "$GITHUB_OUTPUT"
              echo "nat=true" >> "$GITHUB_OUTPUT"
            else
              echo "slot=$INPUT_SLOT" >> "$GITHUB_OUTPUT"
            fi
            exit 0
          fi
          case "$CRON" in
            "31 4 * * 0-4"|"45 8 * * 5,6") SLOT=scrapers ;;
            *)                           SLOT=skip ;;
          esac
          # Fredag og lørdag starter hentningen først, når butikkernes nye uge
          # er ude (butikker-klar.yml), senest kl. 09:00 dansk tid. Sikkerheds-
          # nettet må ikke hente eller genopbygge før, ellers bruges dagens ene
          # D1-genopbygning på sidste uges priser.
          DK_DAG=$(TZ=Europe/Copenhagen date +%u)
          if [ "$SLOT" != "nutrition" ] && { [ "$DK_DAG" = "5" ] || [ "$DK_DAG" = "6" ]; } \
             && [ "$(TZ=Europe/Copenhagen date +%-H)" -lt 9 ]; then
            echo "Fredag/lørdag før kl. 09 dansk tid - venter på at ugens tilbud er ude"
            SLOT=skip
          fi
          # GitHubs scraper-cron er kun sikkerhedsnet for Cloudflare-starten:
          # er Meny (hentes hver nat) allerede startet de sidste 12 t, er
          # natten klaret.
          if [ "$SLOT" = "scrapers" ]; then
            SIDST=$(gh run list -R "$REPO" -w scraper-Meny.yml -L 1 \
              --json createdAt --jq '.[0].createdAt // ""' || echo "")
            if [ -n "$SIDST" ] && \
               [ $(( $(date +%s) - $(date -d "$SIDST" +%s) )) -lt $(( 12 * 3600 )) ]; then
              # Hentningen er startet. Er den mindst 60 min gammel (dispatcheren
              # venter højst 40 min på scraperne), skal cache-updateren også
              # have kørt i dette UTC-døgn; ellers startes den herfra.
              if [ $(( $(date +%s) - $(date -d "$SIDST" +%s) )) -ge 3600 ]; then
                echo "Hentningen startede $SIDST - tjekker cache-updateren"
                SLOT=cache-fallback
              else
                echo "Hentningen startede $SIDST og er stadig i gang - intet at gøre"
                SLOT=skip
              fi
            else
              echo "nat=true" >> "$GITHUB_OUTPUT"
            fi
          fi
          echo "Cron '$CRON' -> $SLOT"
          echo "slot=$SLOT" >> "$GITHUB_OUTPUT"

      - name: Start nattens scrapers
        id: scrapers
        if: steps.slot.outputs.slot == 'scrapers'
        env:
          GH_TOKEN: ${{ github.token }}
          NAT: ${{ steps.slot.outputs.nat || 'false' }}
        run: |
          # Dansk ugedag: 1=man 2=tir 3=ons 4=tor 5=fre 6=lør 7=søn.
          # Se BUTIKSDAGE øverst.
          DAG=$(TZ=Europe/Copenhagen date +%u)
          dage_for() {
            case "$1" in
              scraper-Bilka.yml) echo "5 6" ;;
              # Netto- og Føtex-katalog inkl. ugens tilbud (siden #83):
              # hver nat. Med kun fre-søn viste Netto tirsdag 13-10-2026
              # stadig 200 avisvarer, som Netto selv ikke længere havde på
              # tilbud (fx Havredrik til 12 kr, der kostede 15 kr igen).
              # Kører ~3 min, ingen ekstra D1-skrivning.
              # Spar og Min Købmand skifter uge fredag morgen (målt 23-10-2026:
              # 312 og 453 nye priser); lørdag fanger det, der kommer sent.
              scraper-Spar.yml|scraper-minkobmand.yml) echo "5 6" ;;
              scraper-Lovbjerg.yml) echo "5" ;;
              # Lidls uge starter søndag og weekendpriserne torsdag
              # (lidl.dk, 10-10-2026). Kataloget bliver om onsdagen.
              # Frugt og grønt ("Dyrk prisen") skifter midt i ugen: tirsdag
              # 27-10-2026 var 13 af 88 tilbud nye siden søndag.
              scraper-Lidl.yml) echo "4 7 2" ;;
              scraper-Lidl-Katalog.yml) echo "3" ;;
              # Coops aviser (Tjek) starter ved dansk midnat: ugeavisen fredag,
              # "Søndag & Mandag" søndag, og den slutter mandag (målt 24-10-2026).
              # Kun aviser der gælder nu hentes (tjek_tilbud_scraper.running_now).
              scraper-SuperBrugsen.yml|scraper-Kvickly.yml|scraper-Brugsen.yml) echo "5 7 2" ;;
              # 365discounts uge starter torsdag (Uge 43: 22-10 til 28-10-2026).
              scraper-365discount.yml) echo "4" ;;
              # ABC Lavpris' avis gælder onsdag til tirsdag ("Gælder fra onsdag
              # 28. oktober til og med tirsdag 3. november"); den kommer på
              # abc-lavpris.dk først onsdag (tirsdag 27-10-2026 stod uge 43 der endnu).
              scraper-ABC-Lavpris.yml) echo "3" ;;
              *) echo "1 2 3 4 5 6 7" ;;  # Meny og nye butikker: hver nat
            esac
          }
          FEJL=0
          ANTAL=0
          echo "start=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"
          for wf in \
            scraper-365discount.yml \
            scraper-ABC-Lavpris.yml \
            scraper-Bilka.yml \
            scraper-Brugsen.yml \
            scraper-Katalog.yml \
            scraper-Kvickly.yml \
            scraper-Lidl-Katalog.yml \
            scraper-Lidl.yml \
            scraper-Lovbjerg.yml \
            scraper-Meny.yml \
            scraper-Spar.yml \
            scraper-SuperBrugsen.yml \
            scraper-minkobmand.yml
          do
            if [ "$NAT" = "true" ] \
               && [[ " $(dage_for "$wf") " != *" $DAG "* ]]; then
              echo "Ikke i nat (butiksdage): $wf"
              continue
            fi
            if gh workflow run "$wf" --ref "$REF_NAME" -R "${{ github.repository }}"; then
              echo "Startet: $wf"
              ANTAL=$((ANTAL + 1))
            else
              echo "::error::Kunne ikke starte $wf"
              FEJL=1
            fi
          done
          echo "antal=$ANTAL" >> "$GITHUB_OUTPUT"
          exit $FEJL

      # Kun om natten (nat=true): en manuel start midt på dagen må ikke give
      # en ekstra D1-reseed samme døgn (se D1-skrivebudget i CLAUDE.md).
      - name: Vent på scraperne og start cache-updater
        if: ${{ !cancelled() && steps.slot.outputs.slot == 'scrapers' && steps.slot.outputs.nat == 'true' }}
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          START: ${{ steps.scrapers.outputs.start }}
          ANTAL: ${{ steps.scrapers.outputs.antal || '0' }}
        run: |
          # Højst én cache-updater pr. UTC-døgn (D1's skrivebudget på 100k
          # rækker nulstilles 00:00 UTC, og et fuldt reseed bruger det meste).
          SIDST=$(gh run list -R "$REPO" -w cache-updater.yml -L 1 \
            --json createdAt --jq '.[0].createdAt // ""' || echo "")
          if [ "${SIDST:0:10}" = "$(date -u +%F)" ]; then
            echo "Cache-updater kørte allerede i dag (UTC, $SIDST) - starter den ikke igen"
            exit 0
          fi
          # Venter til alle nattens scrapere er færdige (højst 40 min), så
          # cache-updateren får de nye priser med. Kører en scraper fast,
          # startes cache-updateren alligevel med det, der er nået.
          SLUT=$(( $(date +%s) + 40 * 60 ))
          sleep 20
          while :; do
            TAL=$(gh run list -R "$REPO" -e workflow_dispatch -L 60 \
              --json workflowName,status,createdAt \
              --jq "[.[] | select(.createdAt >= \"$START\" and (.workflowName | startswith(\"Scraper\")))] | \"\(length) \([.[] | select(.status != \"completed\")] | length)\"" \
              || echo "0 0")
            SET=${TAL% *}; AABNE=${TAL#* }
            echo "Scrapere set: $SET af $ANTAL, ikke færdige: $AABNE"
            if [ "$SET" -ge "$ANTAL" ] && [ "$AABNE" = "0" ]; then
              break
            fi
            if [ "$(date +%s)" -ge "$SLUT" ]; then
              echo "::warning::Scraperne var ikke færdige efter 40 min - starter cache-updater alligevel"
              break
            fi
            sleep 30
          done
          gh workflow run cache-updater.yml --ref "$REF_NAME" -R "$REPO"
          echo "Startet: cache-updater.yml"

      - name: Start cache-updater (sikkerhedsnet)
        if: steps.slot.outputs.slot == 'cache-fallback'
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT_NAME: ${{ github.event_name }}
          REPO: ${{ github.repository }}
        run: |
          # Højst én cache-updater pr. UTC-døgn (D1's skrivebudget), også når
          # Cloudflare starter slottet. Vil man tvinge en ekstra kørsel, startes
          # cache-updater.yml direkte.
          SIDST=$(gh run list -R "$REPO" -w cache-updater.yml -L 1 \
            --json createdAt --jq '.[0].createdAt // ""')
          if [ "${SIDST:0:10}" = "$(date -u +%Y-%m-%d)" ]; then
            echo "Cache-updater kørte allerede $SIDST (samme UTC-døgn) - intet at gøre"
            exit 0
          fi
          gh workflow run cache-updater.yml --ref "$REF_NAME" -R "$REPO"

      # Startes herfra og ikke af et workflow_run paa "Update Product Cache":
      # cache-updateren dispatches selv af denne bot, og GitHub udloeser ikke
      # workflow_run for koersler skabt med GITHUB_TOKEN. Den kaede var doed i
      # praksis - build-nutrition naaede aldrig at koere efter en natlig
      # cache-opdatering. Cache-updateren tager ~5 min fra kl. 01:00, saa 02:00
      # har rigelig margin.
      - name: Start nutrition-build
        if: steps.slot.outputs.slot == 'nutrition'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run build-nutrition.yml --ref "$REF_NAME" -R "${{ github.repository }}"
