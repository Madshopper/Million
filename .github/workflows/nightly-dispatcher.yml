name: Nightly Dispatcher

# Starter nattens kæde: scrapers, så cache-updateren, så næringsdata.
# Scraperne og cache-updateren har ingen egen cron - de startes herfra.
#
# Én cron pr. slot (indtil 09-10-2026 to, én pr. sommer-/vintertid, hvor den
# ene altid sprang over og alligevel kostede et Actions-minut). Tiderne er
# valgt, så de ligger efter midnat dansk tid hele året: scrapers 01:01 dansk
# sommertid / 00:01 vintertid, næring 03:00 / 02:00. GitHub-cron kommer i
# praksis 1-4 timer for sent alligevel.
#
# CACHE-UPDATEREN STARTES LIGE EFTER SCRAPERNE (Kalle, 10-10-2026: siden skal
# opdateres så hurtigt som muligt). Før havde den sin egen cron og ventede på
# den: 10-10-2026 var scraperne færdige 04:04 dansk tid, men siden blev først
# opdateret 06:25, fordi den næste cron kom 2 t 20 min for sent. Nu venter
# scraper-slottet selv på scraperne (typisk 2-5 min) og starter den straks.
# Cron-slottet cache-fallback ligger tilbage som sikkerhedsnet senere på
# natten og gør kun noget, hvis cache-updateren ikke har kørt de sidste 8 t.
#
# BUTIKSDAGE (Kalle, 09-10-2026, for at spare GitHub Actions-minutter): hver
# butik hentes kun de nætter, hvor dens nye avis/tilbud kommer (målt i
# price_history 18-09 til 09-10-2026). Meny ændrer 250-450 priser hver dag og
# hentes derfor hver nat; det gør Rema også, fordi den hentes inde i
# cache-updateren. Manuel start af dispatcheren henter altid alle butikker.
on:
  schedule:
    - cron: '1 23 * * *'   # scrapers
    - cron: '0 3 * * *'    # cache-updater, kun sikkerhedsnet
    - cron: '0 1 * * *'    # nutrition
  workflow_dispatch:
    inputs:
      slot:
        description: 'Hvad skal startes'
        type: choice
        options:
          - scrapers
          - cache-fallback
          - nutrition
        default: scrapers

permissions:
  actions: write
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  dispatch:
    runs-on: ubuntu-latest
    timeout-minutes: 110
    steps:
      - name: Bestem slot ud fra cron-linjen
        id: slot
        env:
          EVENT_NAME: ${{ github.event_name }}
          INPUT_SLOT: ${{ inputs.slot }}
          CRON: ${{ github.event.schedule }}
        run: |
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            echo "slot=$INPUT_SLOT" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          case "$CRON" in
            "1 23 * * *") SLOT=scrapers ;;
            "0 3 * * *")  SLOT=cache-fallback ;;
            "0 1 * * *")  SLOT=nutrition ;;
            *)            SLOT=skip ;;
          esac
          echo "Cron '$CRON' -> $SLOT"
          echo "slot=$SLOT" >> "$GITHUB_OUTPUT"

      - name: Start nattens scrapers
        id: scrapers
        if: steps.slot.outputs.slot == 'scrapers'
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          # Dansk ugedag: 1=man 2=tir 3=ons 4=tor 5=fre 6=lør 7=søn.
          # Se BUTIKSDAGE øverst.
          DAG=$(TZ=Europe/Copenhagen date +%u)
          dage_for() {
            case "$1" in
              scraper-Bilka.yml) echo "5 6" ;;
              # Netto- og Føtex-katalog inkl. ugens tilbud (siden #83):
              # Føtex fredag og lørdag, Netto søndag.
              scraper-Katalog.yml) echo "5 6 7" ;;
              scraper-Spar.yml|scraper-minkobmand.yml) echo "6" ;;
              scraper-Lovbjerg.yml) echo "5" ;;
              scraper-Lidl.yml|scraper-Lidl-Katalog.yml) echo "3" ;;
              scraper-SuperBrugsen.yml|scraper-Kvickly.yml|scraper-Brugsen.yml) echo "3 6" ;;
              scraper-365discount.yml|scraper-ABC-Lavpris.yml) echo "2" ;;
              *) echo "1 2 3 4 5 6 7" ;;  # Meny og nye butikker: hver nat
            esac
          }
          FEJL=0
          ANTAL=0
          echo "start=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"
          for wf in \
            scraper-365discount.yml \
            scraper-ABC-Lavpris.yml \
            scraper-Bilka.yml \
            scraper-Brugsen.yml \
            scraper-Katalog.yml \
            scraper-Kvickly.yml \
            scraper-Lidl-Katalog.yml \
            scraper-Lidl.yml \
            scraper-Lovbjerg.yml \
            scraper-Meny.yml \
            scraper-Spar.yml \
            scraper-SuperBrugsen.yml \
            scraper-minkobmand.yml
          do
            if [ "$EVENT_NAME" != "workflow_dispatch" ] \
               && [[ " $(dage_for "$wf") " != *" $DAG "* ]]; then
              echo "Ikke i nat (butiksdage): $wf"
              continue
            fi
            if gh workflow run "$wf" --ref "${{ github.ref_name }}" -R "${{ github.repository }}"; then
              echo "Startet: $wf"
              ANTAL=$((ANTAL + 1))
            else
              echo "::error::Kunne ikke starte $wf"
              FEJL=1
            fi
          done
          echo "antal=$ANTAL" >> "$GITHUB_OUTPUT"
          exit $FEJL

      # Kun om natten: en manuel start midt på dagen må ikke give en ekstra
      # D1-reseed samme døgn (se D1-skrivebudget i CLAUDE.md).
      - name: Vent på scraperne og start cache-updater
        if: ${{ !cancelled() && steps.slot.outputs.slot == 'scrapers' && github.event_name == 'schedule' }}
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          START: ${{ steps.scrapers.outputs.start }}
          ANTAL: ${{ steps.scrapers.outputs.antal || '0' }}
        run: |
          # Venter til alle nattens scrapere er færdige (højst 40 min), så
          # cache-updateren får de nye priser med. Kører en scraper fast,
          # startes cache-updateren alligevel med det, der er nået.
          SLUT=$(( $(date +%s) + 40 * 60 ))
          sleep 20
          while :; do
            TAL=$(gh run list -R "$REPO" -e workflow_dispatch -L 60 \
              --json workflowName,status,createdAt \
              --jq "[.[] | select(.createdAt >= \"$START\" and (.workflowName | startswith(\"Scraper\")))] | \"\(length) \([.[] | select(.status != \"completed\")] | length)\"" \
              || echo "0 0")
            SET=${TAL% *}; AABNE=${TAL#* }
            echo "Scrapere set: $SET af $ANTAL, ikke færdige: $AABNE"
            if [ "$SET" -ge "$ANTAL" ] && [ "$AABNE" = "0" ]; then
              break
            fi
            if [ "$(date +%s)" -ge "$SLUT" ]; then
              echo "::warning::Scraperne var ikke færdige efter 40 min - starter cache-updater alligevel"
              break
            fi
            sleep 30
          done
          # D1-skrivebudgettet nulstilles 00:00 UTC. Kommer cron'en til tiden
          # (23:01 UTC), ville reseedet ramme gårsdagens budget, som nattens
          # forrige reseed allerede har brugt. Så venter vi til efter midnat.
          if [ "$(date -u +%H)" = "23" ]; then
            VENT=$(( $(date -u -d 'tomorrow 00:00:30' +%s) - $(date +%s) ))
            echo "Venter $VENT s til efter 00:00 UTC (D1-budget)"
            sleep "$VENT"
          fi
          gh workflow run cache-updater.yml --ref "${{ github.ref_name }}" -R "$REPO"
          echo "Startet: cache-updater.yml"

      - name: Start cache-updater (sikkerhedsnet)
        if: steps.slot.outputs.slot == 'cache-fallback'
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT_NAME: ${{ github.event_name }}
          REPO: ${{ github.repository }}
        run: |
          if [ "$EVENT_NAME" != "workflow_dispatch" ]; then
            SIDST=$(gh run list -R "$REPO" -w cache-updater.yml -L 1 \
              --json createdAt --jq '.[0].createdAt // ""')
            if [ -n "$SIDST" ] && \
               [ $(( $(date +%s) - $(date -d "$SIDST" +%s) )) -lt $(( 8 * 3600 )) ]; then
              echo "Cache-updater kørte allerede $SIDST - intet at gøre"
              exit 0
            fi
          fi
          gh workflow run cache-updater.yml --ref "${{ github.ref_name }}" -R "$REPO"

      # Startes herfra og ikke af et workflow_run paa "Update Product Cache":
      # cache-updateren dispatches selv af denne bot, og GitHub udloeser ikke
      # workflow_run for koersler skabt med GITHUB_TOKEN. Den kaede var doed i
      # praksis - build-nutrition naaede aldrig at koere efter en natlig
      # cache-opdatering. Cache-updateren tager ~5 min fra kl. 01:00, saa 02:00
      # har rigelig margin.
      - name: Start nutrition-build
        if: steps.slot.outputs.slot == 'nutrition'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run build-nutrition.yml --ref "${{ github.ref_name }}" -R "${{ github.repository }}"
