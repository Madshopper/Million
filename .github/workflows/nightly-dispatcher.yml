name: Nightly Dispatcher

# Starter nattens kæde: scrapers, så cache-updateren, så næringsdata.
# Scraperne og cache-updateren har ingen egen cron - de startes herfra.
#
# START KL. 00:01 DANSK TID (Kalle, 10-10-2026): Cloudflare-workeren
# madshopper-uptime starter slot "nat" til tiden (uptime-worker/worker.js,
# startNight). GitHub-cron kommer i praksis 1-4 timer for sent, så cron'erne
# herunder er kun sikkerhedsnet: scraper-cron'en (01:01 dansk sommertid /
# 00:01 vintertid) gør intet, hvis natten allerede er startet; næring kører
# 03:00 / 02:00.
#
# CACHE-UPDATEREN LIGE EFTER 00:00 UTC (Kalle, 10-10-2026: siden skal opdateres så
# hurtigt som muligt). Den må højst køre én gang pr. UTC-døgn (D1's
# skrivebudget, se CLAUDE.md), så Cloudflare starter slot cache-fallback lige
# efter 00:00 UTC (02:01 dansk sommertid / 01:01 vintertid), og siden er opdateret
# ca. et kvarter efter. Kommer GitHubs scraper-cron først efter midnat UTC
# (sikkerhedsnettet), venter slottet på scraperne og starter den straks. Før
# 10-10-2026 havde den sin egen GitHub-cron og blev opdateret ca. 06:25.
# Slottet cache-fallback gør kun noget, hvis cache-updateren ikke allerede
# har kørt i dette UTC-døgn.
#
# BUTIKSDAGE (Kalle, 09-10-2026, for at spare GitHub Actions-minutter): hver
# butik hentes kun de nætter, hvor dens nye avis/tilbud kommer (målt i
# price_history 18-09 til 09-10-2026). Meny ændrer 250-450 priser hver dag og
# hentes derfor hver nat; det gør Rema også, fordi den hentes inde i
# cache-updateren. Manuel start med slot "scrapers" henter altid alle butikker
# (uden cache-updater bagefter); slot "nat" gør det samme som om natten.
on:
  schedule:
    - cron: '1 23 * * *'   # scrapers
    - cron: '0 3 * * *'    # cache-updater, kun sikkerhedsnet
    - cron: '0 1 * * *'    # nutrition
  workflow_dispatch:
    inputs:
      slot:
        description: 'Hvad skal startes'
        type: choice
        options:
          - scrapers
          - nat
          - cache-fallback
          - nutrition
        default: scrapers

permissions:
  actions: write
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  dispatch:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    # To starter af samme slot lige efter hinanden (fx en dublet fra
    # Cloudflare) kører efter hinanden, så den anden ser at cache-updateren
    # allerede er startet.
    concurrency:
      group: nightly-${{ inputs.slot || github.event.schedule }}
      cancel-in-progress: false
    steps:
      - name: Bestem slot ud fra cron-linjen
        id: slot
        env:
          EVENT_NAME: ${{ github.event_name }}
          INPUT_SLOT: ${{ inputs.slot }}
          CRON: ${{ github.event.schedule }}
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          # nat=true: nattens rigtige kørsel (butiksdage + cache-updater
          # bagefter). "nat" startes kl. 00:01 dansk tid af Cloudflare
          # (uptime-worker/worker.js, startNight). Manuel "scrapers" henter
          # alle butikker og rører ikke cache-updateren.
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            if [ "$INPUT_SLOT" = "nat" ]; then
              echo "slot=scrapers" >> "$GITHUB_OUTPUT"
              echo "nat=true" >> "$GITHUB_OUTPUT"
            else
              echo "slot=$INPUT_SLOT" >> "$GITHUB_OUTPUT"
            fi
            exit 0
          fi
          case "$CRON" in
            "1 23 * * *") SLOT=scrapers ;;
            "0 3 * * *")  SLOT=cache-fallback ;;
            "0 1 * * *")  SLOT=nutrition ;;
            *)            SLOT=skip ;;
          esac
          # GitHubs scraper-cron er kun sikkerhedsnet for Cloudflare-starten:
          # er Meny (hentes hver nat) allerede startet de sidste 12 t, er
          # natten klaret.
          if [ "$SLOT" = "scrapers" ]; then
            SIDST=$(gh run list -R "$REPO" -w scraper-Meny.yml -L 1 \
              --json createdAt --jq '.[0].createdAt // ""' || echo "")
            if [ -n "$SIDST" ] && \
               [ $(( $(date +%s) - $(date -d "$SIDST" +%s) )) -lt $(( 12 * 3600 )) ]; then
              echo "Nattens hentning startede allerede $SIDST - intet at gøre"
              SLOT=skip
            else
              echo "nat=true" >> "$GITHUB_OUTPUT"
            fi
          fi
          echo "Cron '$CRON' -> $SLOT"
          echo "slot=$SLOT" >> "$GITHUB_OUTPUT"

      - name: Start nattens scrapers
        id: scrapers
        if: steps.slot.outputs.slot == 'scrapers'
        env:
          GH_TOKEN: ${{ github.token }}
          NAT: ${{ steps.slot.outputs.nat || 'false' }}
        run: |
          # Dansk ugedag: 1=man 2=tir 3=ons 4=tor 5=fre 6=lør 7=søn.
          # Se BUTIKSDAGE øverst.
          DAG=$(TZ=Europe/Copenhagen date +%u)
          dage_for() {
            case "$1" in
              scraper-Bilka.yml) echo "5 6" ;;
              # Netto- og Føtex-katalog inkl. ugens tilbud (siden #83):
              # hver nat. Med kun fre-søn viste Netto tirsdag 13-10-2026
              # stadig 200 avisvarer, som Netto selv ikke længere havde på
              # tilbud (fx Havredrik til 12 kr, der kostede 15 kr igen).
              # Kører ~3 min, ingen ekstra D1-skrivning.
              scraper-Spar.yml|scraper-minkobmand.yml) echo "6" ;;
              scraper-Lovbjerg.yml) echo "5" ;;
              # Lidls uge starter søndag og weekendpriserne torsdag
              # (lidl.dk, 10-10-2026). Kataloget bliver om onsdagen.
              scraper-Lidl.yml) echo "4 7" ;;
              scraper-Lidl-Katalog.yml) echo "3" ;;
              scraper-SuperBrugsen.yml|scraper-Kvickly.yml|scraper-Brugsen.yml) echo "3 6" ;;
              scraper-365discount.yml|scraper-ABC-Lavpris.yml) echo "2" ;;
              *) echo "1 2 3 4 5 6 7" ;;  # Meny og nye butikker: hver nat
            esac
          }
          FEJL=0
          ANTAL=0
          echo "start=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"
          for wf in \
            scraper-365discount.yml \
            scraper-ABC-Lavpris.yml \
            scraper-Bilka.yml \
            scraper-Brugsen.yml \
            scraper-Katalog.yml \
            scraper-Kvickly.yml \
            scraper-Lidl-Katalog.yml \
            scraper-Lidl.yml \
            scraper-Lovbjerg.yml \
            scraper-Meny.yml \
            scraper-Spar.yml \
            scraper-SuperBrugsen.yml \
            scraper-minkobmand.yml
          do
            if [ "$NAT" = "true" ] \
               && [[ " $(dage_for "$wf") " != *" $DAG "* ]]; then
              echo "Ikke i nat (butiksdage): $wf"
              continue
            fi
            if gh workflow run "$wf" --ref "${{ github.ref_name }}" -R "${{ github.repository }}"; then
              echo "Startet: $wf"
              ANTAL=$((ANTAL + 1))
            else
              echo "::error::Kunne ikke starte $wf"
              FEJL=1
            fi
          done
          echo "antal=$ANTAL" >> "$GITHUB_OUTPUT"
          exit $FEJL

      # Kun om natten (nat=true): en manuel start midt på dagen må ikke give
      # en ekstra D1-reseed samme døgn (se D1-skrivebudget i CLAUDE.md).
      - name: Vent på scraperne og start cache-updater
        if: ${{ !cancelled() && steps.slot.outputs.slot == 'scrapers' && steps.slot.outputs.nat == 'true' }}
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          START: ${{ steps.scrapers.outputs.start }}
          ANTAL: ${{ steps.scrapers.outputs.antal || '0' }}
        run: |
          # D1-skrivebudgettet (100k rækker) nulstilles 00:00 UTC, og et fuldt
          # reseed bruger det meste. Har cache-updateren allerede kørt i dette
          # UTC-døgn (det normale, når natten starter kl. 00:01 dansk tid), må
          # den ikke køre igen før 00:00 UTC. Så startes den ikke herfra:
          # Cloudflare (uptime-worker, startCache) starter slot cache-fallback
          # lige efter 00:00 UTC. At vente her kostede ~2 timers Actions-minutter
          # hver nat (målt 11-10-2026). Kommer GitHubs cron først efter
          # midnat UTC (sikkerhedsnettet), startes den straks.
          SIDST=$(gh run list -R "$REPO" -w cache-updater.yml -L 1 \
            --json createdAt --jq '.[0].createdAt // ""' || echo "")
          if [ "${SIDST:0:10}" = "$(date -u +%F)" ]; then
            echo "Cache-updater kørte allerede i dag (UTC, $SIDST) - Cloudflare starter den lige efter 00:00 UTC"
            exit 0
          fi
          # Lørdag (UTC) starter Cloudflare den først kl. 04:00 UTC efter en ny
          # hentning af Netto (se cache-fallback herunder).
          if [ "$(date -u +%u)" = "6" ]; then
            echo "Lørdag: cache-updateren startes af slot cache-fallback efter Nettos nye avis"
            exit 0
          fi
          # Venter til alle nattens scrapere er færdige (højst 40 min), så
          # cache-updateren får de nye priser med. Kører en scraper fast,
          # startes cache-updateren alligevel med det, der er nået.
          SLUT=$(( $(date +%s) + 40 * 60 ))
          sleep 20
          while :; do
            TAL=$(gh run list -R "$REPO" -e workflow_dispatch -L 60 \
              --json workflowName,status,createdAt \
              --jq "[.[] | select(.createdAt >= \"$START\" and (.workflowName | startswith(\"Scraper\")))] | \"\(length) \([.[] | select(.status != \"completed\")] | length)\"" \
              || echo "0 0")
            SET=${TAL% *}; AABNE=${TAL#* }
            echo "Scrapere set: $SET af $ANTAL, ikke færdige: $AABNE"
            if [ "$SET" -ge "$ANTAL" ] && [ "$AABNE" = "0" ]; then
              break
            fi
            if [ "$(date +%s)" -ge "$SLUT" ]; then
              echo "::warning::Scraperne var ikke færdige efter 40 min - starter cache-updater alligevel"
              break
            fi
            sleep 30
          done
          gh workflow run cache-updater.yml --ref "${{ github.ref_name }}" -R "$REPO"
          echo "Startet: cache-updater.yml"

      - name: Start cache-updater (sikkerhedsnet)
        if: steps.slot.outputs.slot == 'cache-fallback'
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT_NAME: ${{ github.event_name }}
          REPO: ${{ github.repository }}
        run: |
          # Højst én cache-updater pr. UTC-døgn (D1's skrivebudget), også når
          # Cloudflare starter slottet. Vil man tvinge en ekstra kørsel, startes
          # cache-updater.yml direkte.
          SIDST=$(gh run list -R "$REPO" -w cache-updater.yml -L 1 \
            --json createdAt --jq '.[0].createdAt // ""')
          if [ "${SIDST:0:10}" = "$(date -u +%Y-%m-%d)" ]; then
            echo "Cache-updater kørte allerede $SIDST (samme UTC-døgn) - intet at gøre"
            exit 0
          fi
          # LØRDAG: Nettos nye avis starter lørdag, men ligger først hos Netto
          # efter midnat. Hentningen kl. 00:01 dansk tid fik derfor sidste uges
          # avis (17-10-2026: Skildpadde is 54,95 kr i stedet for 32 kr, 182 af
          # 201 avisvarer manglede). Cloudflare starter derfor dette slot kl.
          # 04:00 UTC om lørdagen (uptime-worker/worker.js), og Netto + Føtex
          # hentes igen her lige før cache-updateren (~4 min).
          if [ "$(TZ=Europe/Copenhagen date +%u)" = "6" ]; then
            START=$(date -u +%Y-%m-%dT%H:%M:%SZ)
            gh workflow run scraper-Katalog.yml --ref "${{ github.ref_name }}" -R "$REPO"
            echo "Startet: scraper-Katalog.yml (Nettos lørdagsavis)"
            SLUT=$(( $(date +%s) + 25 * 60 ))
            sleep 20
            while :; do
              STATUS=$(gh run list -R "$REPO" -w scraper-Katalog.yml -L 5 \
                --json status,createdAt \
                --jq "[.[] | select(.createdAt >= \"$START\")] | .[0].status // \"\"" \
                || echo "")
              echo "scraper-Katalog: ${STATUS:-ikke set endnu}"
              [ "$STATUS" = "completed" ] && break
              if [ "$(date +%s)" -ge "$SLUT" ]; then
                echo "::warning::scraper-Katalog var ikke færdig efter 25 min - starter cache-updater alligevel"
                break
              fi
              sleep 30
            done
          fi
          gh workflow run cache-updater.yml --ref "${{ github.ref_name }}" -R "$REPO"

      # Startes herfra og ikke af et workflow_run paa "Update Product Cache":
      # cache-updateren dispatches selv af denne bot, og GitHub udloeser ikke
      # workflow_run for koersler skabt med GITHUB_TOKEN. Den kaede var doed i
      # praksis - build-nutrition naaede aldrig at koere efter en natlig
      # cache-opdatering. Cache-updateren tager ~5 min fra kl. 01:00, saa 02:00
      # har rigelig margin.
      - name: Start nutrition-build
        if: steps.slot.outputs.slot == 'nutrition'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run build-nutrition.yml --ref "${{ github.ref_name }}" -R "${{ github.repository }}"
