name: Mobile app tests

# Fase 9-forberedelse: kør de samme lette, netværksfrie checks som
# apps/mobile/README.md § Tests beskriver, på hver PR, så en regression i
# multi-deal/SCO-portering eller listing-API-kontrakten opdages før merge.
# Ingen Playwright/smoke-tests her - de kører allerede mod staging i
# deploy-edge-dev.yml.
#
# TRIGGEREN: kun pull_request og manuel start. Indtil 09-10-2026 kørte den
# også ved push til main, fordi alt arbejde tidligere var direkte pushes. Nu
# går alt via PR'er til main, så samme kode var testet to gange; push-
# triggeren er fjernet for at spare GitHub Actions-minutter.
on:
  pull_request:
    paths:
      - 'apps/mobile/**'
      - 'app.py'
      - 'app_support.py'
      - 'scripts/test-listing-api.py'
      - '.github/workflows/mobile-tests.yml'
  workflow_dispatch:

# En ny push til samme PR stopper den gamle kørsel (sparer minutter).
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  mobile-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      # Node 22, ikke 20: app'ens unit-tests koeres med
      # `node --experimental-strip-types` (koerer .ts direkte, uden
      # byggetrin), og det flag findes foerst fra Node 22.6. Paa Node 20
      # doer de med "bad option" foer en eneste assertion naar at koere.
      #
      # Det var usynligt indtil 19-08-2026, fordi workflowet kun var koblet
      # paa `pull_request` og repoet har haft ÉN pull request nogensinde -
      # testene havde derfor aldrig koert i CI, kun lokalt paa en nyere Node.
      # Foerste gang push-triggeren blev slaaet til, fejlede de med det samme.
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install mobile deps
        working-directory: apps/mobile
        run: npm ci

      - name: Run mobile unit tests (multi-deal + SCO)
        working-directory: apps/mobile
        run: npm test

      - name: Typecheck mobile app
        working-directory: apps/mobile
        run: npx tsc --noEmit

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Setup Python
        run: uv python install 3.12

      - name: Install Python dependencies
        run: uv sync

      - name: Run listing-API contract tests
        run: uv run python scripts/test-listing-api.py
