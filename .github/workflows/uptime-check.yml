name: Uptime Check

# Uafhængig overvågning af produktionen. Under nedbruddet 2026-07-19 gik der
# ~3 timer fra første fejlbølge til første rollback, fordi intet alarmerede.
# Workers-observability er nu permanent slået fra (dens introspektion var selv
# årsagen til nedbruddet), så dette tjek er sitets primære alarm: GitHub sender
# mail til vedligeholderen, når et scheduled workflow fejler.
#
# GitHubs cron-minimum er 5 min, og scheduled runs kan forsinkes nogle minutter
# i spidsbelastning - det er stadig minutter i stedet for timer. Hver kørsel
# er ~6 requests i værste fald (3 forsøg x 2 sider); ingenting mod
# free-planens 100k/dag.
#
# Bemærk: GitHub deaktiverer scheduled workflows efter 60 dages inaktivitet i
# repoet - et push/commit nulstiller uret.
#
# 2026-07-20: curl blev konsekvent 403'et af Cloudflares GRATIS Bot Fight
# Mode (bekræftet via Security Analytics: "Managed Challenge", Azure-ASN
# 8075). Et forsøg med en delt hemmelighed (CI_BYPASS_SECRET) + en WAF-
# skip-regel virkede ALDRIG, selv efter secret og regel begge var korrekt
# sat op - Bot Fight Mode (i modsætning til Super Bot Fight Mode på
# Pro-planen+) kører ikke på WAF'ens Ruleset-motor og kan derfor ikke
# skippes af nogen WAF-regel (bekræftet mod Cloudflares egen dokumentation).
# Erstattet med scripts/playwright-uptime-check.mjs, som bruger en rigtig
# (headless) browser til at løse JS-udfordringen i stedet for at forsøge at
# omgå den.
#
# 2026-07-27: en tredje side (/ugens_tilbud) blev kortvarigt tilføjet og
# udløste 403 på både den og /Mejeri i stort set alle kørsler - en 2s
# pause mellem sideindlæsninger løste det IKKE. Tilbage til de to sider,
# der beviseligt kørte stabilt (25/26 grønne kørsler før tredje side kom
# på). Tilføj ikke flere sider til dette tjek uden at teste over flere
# timer først.
#
# 2026-09-28: search-check.yml er lagt ind her som et ekstra TRIN (egen
# node-proces og dermed egen browser-instans, ligesom hver url allerede får
# sin egen i scripts/playwright-uptime-check.mjs). Sparer én Playwright-
# installation og en hel runner pr. søgetjek - repoet skal være privat og
# holde sig under de 2.000 gratis Actions-minutter. Søgningen er en kold
# D1-tabelscanning (~19k rows_read), derfor kører workflowet hver 3. time
# og ikke hvert 5. min: 8 x 19k = ~152k rows_read/døgn mod budgettet på 5M.
# I praksis kørte */5 alligevel kun ~6 gange i døgnet (GitHub-cron).
# Søgetrinnet har `if: always()`, så begge tjek måles, selv om det første
# fejler.
#
# 2026-09-28 (samme dag): security-monitor.yml's planlagte kørsel er også lagt
# ind her som et trin - ét runner-opstart i stedet for tre. security-monitor.yml
# findes stadig til manuelle kørsler med cpu_detail_from/-to. Scriptets
# LOOKBACK_HOURS er 24 t, så hver 3. time er rigeligt. Playwright bruger nu
# runnerens forudinstallerede Chrome (PW_CHANNEL=chrome) i stedet for at
# downloade Chromium (~25 s), så hele jobbet holder sig under ét afregnet minut.
#
# 2026-10-02: browsertjekkene (forside, kategori og frisk søgning) er flyttet
# helt til Cloudflare: uptime-worker/ tjekker hvert 5. minut og den friske
# søgning én gang i døgnet, og mailer via Resend. En worker-fetch bliver ikke
# stoppet af Bot Fight Mode, så der skal ingen rigtig browser til. Tilbage her
# er sikkerhedsrelæet og synken af kørselshistorik til /admin, hver 3. time.
# Navnet uptime-check.yml er beholdt, så job_runs-historikken hænger sammen.

on:
  workflow_dispatch:
  schedule:
    - cron: '23 */3 * * *'


concurrency:
  group: security-monitor
  cancel-in-progress: false

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # actions: read til kørselshistorik-trinnet (scripts/sync-job-runs.py).
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@v4

      # Sikkerhedsrelæet kalder `npx wrangler d1 execute`.
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install httpx
        run: pip install httpx

      # Tidligere den planlagte del af security-monitor.yml. Exit-kode 1 ved
      # alarm er bevidst - det er den, der udløser GitHubs mail.
      - name: Sikkerhedshaendelser (security-monitor)
        if: always()
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          DEPLOY_KEY: ${{ secrets.DEPLOY_KEY }}
        run: python scripts/relay-security-events.py

      # Kørselshistorik til /admin ("Kørsler"): gemmer de seneste GitHub
      # Actions-kørsler i Supabase (public.job_runs) med workflowets egen token.
      # Ikke et måletrin og ikke en alarm, så det må ikke gøre tjekket rødt;
      # stopper synken, viser admin-panelet hvor længe siden den sidst kørte.
      - name: Gem kørselshistorik (admin)
        if: always()
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ github.token }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          DEPLOY_KEY: ${{ secrets.DEPLOY_KEY }}
        run: python scripts/sync-job-runs.py
