name: Recipe Import & Moderation

# Kører recipe_importer.py (opskrift-import fra URL + genmatch af bruger-
# indsendte opskrifter, se docs/Features.md). Ingen AI/Ollama involveret -
# se recipe_importer.py's moduldokumentation for hvorfor.

on:
  # Dagligt (import, moderation og opskrifternes priser), men kun når
  # opskrifterne er udgivet fra Feature-fanen i /admin (tjekkes i første trin
  # via scripts/feature_flags.py). Mens de er skjult,
  # stopper kørslen efter tjekket. Manuel start kører altid.
  schedule:
    - cron: '0 4 * * *'
  workflow_dispatch:
    inputs:
      url:
        description: 'Opskrift-URL til admin-import (tom = kør moderation af ventende bruger-opskrifter)'
        type: string
        default: ''

concurrency:
  group: recipe-import
  cancel-in-progress: false

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  recipe-import:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Er opskrifterne udgivet?
        id: feature
        if: ${{ github.event_name == 'schedule' }}
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: python3 scripts/feature_flags.py recipes

      - name: Setup Python
        if: ${{ github.event_name != 'schedule' || steps.feature.outputs.on == 'true' }}
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Python dependencies
        if: ${{ github.event_name != 'schedule' || steps.feature.outputs.on == 'true' }}
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Kør opskrift-import/-moderation
        if: ${{ github.event_name != 'schedule' || steps.feature.outputs.on == 'true' }}
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          DEPLOY_KEY: ${{ secrets.DEPLOY_KEY }}
          RECIPE_URL: ${{ inputs.url }}
        run: |
          if [ -n "$RECIPE_URL" ]; then
            python recipe_importer.py "$RECIPE_URL"
          else
            python recipe_importer.py moderate
          fi

      # Opskrifternes priser efter nattens nye butikspriser (se
      # recipe_pricing.py's moduldokumentation for hvorfor den kører her).
      - name: Genberegn opskrift-priser
        if: ${{ github.event_name != 'schedule' || steps.feature.outputs.on == 'true' }}
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          DEPLOY_KEY: ${{ secrets.DEPLOY_KEY }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: python recipe_pricing.py
