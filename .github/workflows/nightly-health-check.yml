name: Nightly Pipeline Health Check

# Bot-dispatchede workflows (cache-updater, build-nutrition, alle scraper-*.yml)
# koeres via "gh workflow run" fra nightly-dispatcher.yml med GITHUB_TOKEN.
# Aktoeren paa DISSE koersler er github-actions[bot] - IKKE et menneske - og
# GitHubs indbyggede fejl-mail til vedligeholderen naar et scheduled workflow
# fejler er bundet til den aktoer/watcher der udloeste koerslen, ikke bare
# repoet generelt.
#
# Bevist i praksis, ikke kun formodet: build-nutrition.yml fejlede 12 gange i
# traek uden at nogen blev advaret, praecis fordi den kun startes bot-dispatchet
# (se dens egen kommentar). cache-updater.yml's "Fail jobbet hvis D1-reseed
# fejlede"-trin ANTAGER at samme mail sendes for dens egne bot-dispatchede
# nataligekoersler - en antagelse der ikke er efterprovet og modsiges direkte
# af build-nutritions dokumenterede historik. Alle scraper-*.yml er dispatchet
# paa praecis samme maade.
#
# Dette workflow tilfoejer ingen ny forretningslogik - det laeser blot
# konklusionen af hver af de bot-dispatchede workflows' seneste koersel. Fordi
# DETTE workflow selv er schedule-trigget (en menneskelig "aktoer" i GitHubs
# oejne), bruger dets EGEN fejl den alarmkanal der er verificeret at virke
# (samme som security-monitor.yml).
#
# 30-timers-graensen er bevidst rummelig: build-nutrition.yml kan tage op til
# ca. 6 timer ved et stort efterslaeb, og sommer-/vintertidsskiftet i
# nightly-dispatcher.yml flytter start-tidspunktet ±1 time.

# SIDEN 24-10-2026 også dagens andre små opgaver i samme kørsel (hvert job
# koster mindst 1 GitHub Actions-minut): Apples app-tal til /admin (før
# app-stats.yml) og start af opskrift-importen, når opskrifterne er udgivet
# (før recipe-import.yml's egen cron). Trinene kører hver for sig, så et rødt
# tjek ikke stopper app-tallene.
on:
  workflow_dispatch:
  schedule:
    - cron: '0 6 * * *'   # 08:00 dansk sommertid / 07:00 vintertid - rigelig margin efter hele nattens kaede

permissions:
  actions: write   # starter recipe-import.yml (trinnet nederst)
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  check:
    # Kun fra main: kørslen bruger hemmelige nøgler (sikkerhedstjek runde 3).
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Tjek at nattens bot-dispatchede workflows rent faktisk lykkedes
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          FEJL=0
          for wf in \
            cache-updater.yml \
            build-nutrition.yml \
            scraper-365discount.yml \
            scraper-ABC-Lavpris.yml \
            scraper-Bilka.yml \
            scraper-Brugsen.yml \
            scraper-Katalog.yml \
            scraper-Kvickly.yml \
            scraper-Lidl-Katalog.yml \
            scraper-Lidl.yml \
            scraper-Lovbjerg.yml \
            scraper-Meny.yml \
            scraper-Spar.yml \
            scraper-SuperBrugsen.yml \
            scraper-minkobmand.yml
          do
            ROW=$(gh run list --workflow "$wf" -R "${{ github.repository }}" \
              --limit 1 --json conclusion,status,createdAt,url --jq '.[0]')
            if [ -z "$ROW" ] || [ "$ROW" = "null" ]; then
              echo "::error::$wf: ingen koersel fundet nogensinde"
              FEJL=1
              continue
            fi
            CREATED=$(echo "$ROW" | jq -r '.createdAt')
            STATUS=$(echo "$ROW" | jq -r '.status')
            KONKLUSION=$(echo "$ROW" | jq -r '.conclusion')
            URL=$(echo "$ROW" | jq -r '.url')
            CREATED_EPOCH=$(date -u -d "$CREATED" +%s)
            NOW_EPOCH=$(date -u +%s)
            ALDER_TIMER=$(( (NOW_EPOCH - CREATED_EPOCH) / 3600 ))
            # Butiksdage (nightly-dispatcher.yml): de fleste butikker hentes kun
            # 1-2 nætter om ugen, så de må være op til en uge gamle. Det der
            # kører hver nat, skal stadig være under 30 timer.
            case "$wf" in
              cache-updater.yml|build-nutrition.yml|scraper-Meny.yml) GRAENSE=30 ;;
              *) GRAENSE=170 ;;
            esac
            if [ "$ALDER_TIMER" -gt "$GRAENSE" ]; then
              echo "::error::$wf: seneste koersel er $ALDER_TIMER timer gammel ($URL) - koerte den slet ikke i nat?"
              FEJL=1
            elif [ "$STATUS" = "completed" ] && [ "$KONKLUSION" != "success" ]; then
              echo "::error::$wf: seneste koersel endte som '$KONKLUSION' - $URL"
              FEJL=1
            else
              echo "$wf: ok (alder ${ALDER_TIMER}t, $KONKLUSION/$STATUS)"
            fi
          done
          exit $FEJL

      - uses: actions/checkout@v4
        if: ${{ !cancelled() }}

      - name: Setup Python
        if: ${{ !cancelled() }}
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      # Henter salgs-, analytics- og anmeldelsestal for de seneste dage
      # (SALES_DAYS), så tidspunktet på dagen er ligegyldigt.
      - name: App-tal fra Apple (fanen App i /admin)
        if: ${{ !cancelled() }}
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_PRIVATE_KEY: ${{ secrets.ASC_PRIVATE_KEY }}
          ASC_VENDOR_NUMBER: ${{ secrets.ASC_VENDOR_NUMBER }}
          ASC_ADMIN_KEY_ID: ${{ secrets.ASC_ADMIN_KEY_ID }}
          ASC_ADMIN_PRIVATE_KEY: ${{ secrets.ASC_ADMIN_PRIVATE_KEY }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          DEPLOY_KEY: ${{ secrets.DEPLOY_KEY }}
        run: |
          pip install 'pyjwt[crypto]==2.10.1'
          python scripts/app-store-stats.py

      - name: Er opskrifterne udgivet?
        id: opskrifter
        if: ${{ !cancelled() }}
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: python3 scripts/feature_flags.py recipes

      - name: Start opskrift-import
        if: ${{ !cancelled() && steps.opskrifter.outputs.on == 'true' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run recipe-import.yml --ref main -R "${{ github.repository }}"
